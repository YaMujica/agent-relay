services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: agent_relay
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agent_relay"]
      interval: 2s
      timeout: 5s
      retries: 5

  agent-relay:
    build: .
    restart: always
    environment:
      RELAY_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/agent_relay
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
